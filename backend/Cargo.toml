[package]
name = "gateway"
version = "0.1.0"
edition = "2021"

# Standalone package.
[workspace]

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
futures-core = "0.3"

[profile.release]
opt-level = 3
lto = true
strip = true
